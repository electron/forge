name: CI

on:
  push:
    branches:
      - main
      - next
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check whether only docs/ changed
        id: filter
        # Only pull requests and merge groups have a base commit to diff against;
        # pushes to main/next and tag builds always run the full suite.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "No base commit for this event; running the full suite."
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^docs/'; then
            echo "Only files under docs/ changed; skipping the test jobs."
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Configure git
        run: git config --global core.autocrlf input

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Electron Forge
        run: yarn build

      - name: Lint codebase
        run: |
          yarn lint
          yarn constraints
          yarn knip

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-files
          path: packages/*/*/dist/*

  fast-tests:
    needs:
      - changes
      - lint-and-build
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        arch: [x64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
          - os: ubuntu-22.04
            arch: arm64
          - os: macos-latest
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure git
        run: git config --global core.autocrlf input

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Use D:\\ drive for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /d/fast-temp
          echo "YARN_GLOBAL_FOLDER=D:\\yarn-data" >> $GITHUB_ENV
          echo "TEMP=D:\\fast-temp" >> $GITHUB_ENV

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-files
          path: packages

      - name: Linux setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            --no-install-recommends \
            xvfb \
            libnss3 \
            libasound2 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-dev \
            libgtk-3-0 \
            libgbm1
          sudo add-apt-repository -y ppa:alexlarsson/flatpak

      - name: Install pnpm
        run: npm install -g pnpm@11.21.0

      - name: Run fast tests
        run: |
          mkdir -p ./reports/out
          yarn test:fast --reporter=default --reporter=junit --outputFile="./reports/out/test_output.xml"

  slow-tests:
    needs:
      - changes
      - lint-and-build
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        arch: [x64, arm64]
        # The `slow` and `slow-verdaccio` vitest projects run in separate jobs,
        # and the Verdaccio one, which takes about three times as long, is split
        # into three shards that run in parallel. Vitest shards by test file and
        # only balances the file count, not the duration, so check the job
        # timings before assuming that another shard would help.
        suite: [slow, verdaccio-1, verdaccio-2, verdaccio-3]
        exclude:
          - os: windows-latest
            arch: arm64
          - os: ubuntu-22.04
            arch: arm64
          - os: macos-latest
            arch: x64
        include:
          - suite: verdaccio-1
            shard: 1/3
          - suite: verdaccio-2
            shard: 2/3
          - suite: verdaccio-3
            shard: 3/3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure git
        run: git config --global core.autocrlf input

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Use D:\\ drive for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /d/fast-temp
          echo "YARN_GLOBAL_FOLDER=D:\\yarn-data" >> $GITHUB_ENV
          echo "TEMP=D:\\fast-temp" >> $GITHUB_ENV

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-files
          path: packages

      - name: Linux setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            --no-install-recommends \
            xvfb \
            libnss3 \
            libasound2 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgdk-pixbuf2.0-dev \
            libgtk-3-0 \
            libgbm1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pnpm
        run: npm install -g pnpm@11.21.0

      # The Verdaccio tests age-gate their installs like the root `.yarnrc.yml`
      # does, which needs npm 11.17: 11.10 added `min-release-age`
      # (npm/cli#8965) and 11.17 added `min-release-age-exclude`
      # (npm/cli#9534). Both are newer than the npm bundled with the Node
      # version in `.nvmrc`. npm 12 requires Node
      # `^22.22.2 || ^24.15.0 || >=26`, so it cannot be installed on that Node
      # version at all; bump this pin when `.nvmrc` moves.
      - name: Install npm
        run: npm install -g npm@11.19.0

      - name: Run slow tests
        if: matrix.suite == 'slow'
        run: |
          mkdir -p ./reports/out
          yarn test:slow --reporter=default --reporter=junit --outputFile="./reports/out/test_output.xml"

      - name: Run Verdaccio tests
        if: matrix.suite != 'slow'
        run: |
          mkdir -p ./reports/out
          yarn test:verdaccio --reporter=default --reporter=junit --outputFile="./reports/out/test_output_verdaccio.xml" --shard=${{ matrix.shard }}

  required-ci:
    needs:
      - changes
      - lint-and-build
      - fast-tests
      - slow-tests
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_AND_BUILD_RESULT: ${{ needs.lint-and-build.result }}
          FAST_TESTS_RESULT: ${{ needs.fast-tests.result }}
          SLOW_TESTS_RESULT: ${{ needs.slow-tests.result }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "  changes:        $CHANGES_RESULT"
          echo "  lint-and-build: $LINT_AND_BUILD_RESULT"
          echo "  fast-tests:     $FAST_TESTS_RESULT"
          echo "  slow-tests:     $SLOW_TESTS_RESULT"
          exit 1
      - name: We are done
        run: echo "Hello World"
